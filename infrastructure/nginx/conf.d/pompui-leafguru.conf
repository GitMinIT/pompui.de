server {
    listen 80;
    server_name leafguru.pompui.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name leafguru.pompui.de;

    # Provider (IONOS/Sectigo) wildcard certificate *.pompui.de
    ssl_certificate /etc/nginx/ssl/fullchain-pompui.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-pompui.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # The app serves its own pages, scripts and styles. The AI-notice
    # badge and the Home button are part of the app's OWN layout (it
    # has its own repository), so the shared chrome is NOT injected
    # here - that would put two badges on the page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_req zone=general burst=20 nodelay;

    # Photos are uploaded to the app; the server-side limit is 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://pompui-leafguru:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
