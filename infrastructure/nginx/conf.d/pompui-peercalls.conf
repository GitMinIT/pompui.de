# Peer Calls (peercalls.pompui.de) — WebRTC video calls (Apache-2.0,
# github.com/GitMinIT/peer-calls fork). The container only serves HTTP and
# the WebSocket signalling endpoint (/ws); audio/video/data flow
# peer-to-peer between the browsers via ICE (STUN/TURN is served separately
# by pompui-coturn on host UDP/TCP 3478 — no nginx involvement needed there).
map $http_upgrade $peercalls_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name peercalls.pompui.de;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name peercalls.pompui.de;

    # Provider (IONOS/Sectigo) wildcard certificate *.pompui.de
    ssl_certificate /etc/nginx/ssl/fullchain-pompui.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-pompui.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    limit_req zone=general burst=20 nodelay;

    location / {
        proxy_pass http://pompui-peercalls:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket signalling (/ws) needs HTTP/1.1 + Upgrade headers and
        # long-lived connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $peercalls_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
