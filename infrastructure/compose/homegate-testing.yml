# HomeGate testing/debugging stack (explicit override — NOT auto-loaded).
#
# This server exists to implement, test and debug this project. Nothing is
# published from here before being verified, so the stack is HTTP-only and
# site containers are exposed directly — no global-proxy, no TLS.
#
# Port plan on this host (one direct HTTP port per project/site):
#   daniel-hettich.de        -> 6009 (daniel-hettich.de repo)
#   pompui.de (landing)      -> 6010 (this repo)
#   punctum.pompui.de        -> 6012 (this repo; 6011 is taken by open-webui)
#   gj.pompui.de             -> 6013 (this repo)
#   snapotter.pompui.de      -> 6014 (this repo; first boot pulls/loads the
#                               12+ GB AGPL image and runs embedded
#                               PostgreSQL+Redis — takes a while to become
#                               healthy; needs secrets/snapotter-password)
#   vtracer.pompui.de        -> 6015 (this repo; heavy one-time build:
#                               Rust→wasm + webpack, ~10 min cold build)
#   metronome.pompui.de      -> 6022 (this repo; static Vite build; 6016-6018
#                               are taken by other services on this host)
#   peercalls.pompui.de      -> 6023 (this repo; Peer Calls Go server, port 3000)
#   coturn (STUN/TURN)       -> 3478 udp/tcp + 49160-49200 udp published directly
#                               (UDP cannot be reverse-proxied; LAN testing only —
#                               internet clients need the public IP + firewall rules)
#
# The external `web-network` (created by the daniel-hettich.de project) is not
# needed in this workflow; joining it would fail when that stack is not up.
#
# Usage (paths in override files resolve against the first compose file's dir):
#   docker compose -f docker-compose.yml -f infrastructure/compose/homegate-testing.yml up -d --build

services:
  pompui-landing:
    ports: !override
      - "6010:8080"
    networks: !override
      - pompui-network

  pompui-punctum:
    ports: !override
      - "6012:8080"
    networks: !override
      - pompui-network

  pompui-garden-journal:
    ports: !override
      - "6013:3000"
    networks: !override
      - pompui-network

  pompui-snapotter:
    ports: !override
      - "6014:1349"
    networks: !override
      - pompui-network

  pompui-vtracer:
    ports: !override
      - "6015:8080"
    networks: !override
      - pompui-network

  pompui-metronome:
    ports: !override
      - "6022:8080"
    networks: !override
      - pompui-network

  pompui-peercalls:
    ports: !override
      - "6023:3000"
    networks: !override
      - pompui-network
    # locally the ICE servers are addressed by LAN IP (no DNS for turn.pompui.de
    # inside the LAN, no hairpin NAT); same TURN REST secret from .env
    environment: !override
      - PEERCALLS_ICE_SERVER_URLS=stun:192.168.178.60:3478,turn:192.168.178.60:3478?transport=udp,turn:192.168.178.60:3478?transport=tcp
      - PEERCALLS_ICE_SERVER_AUTH_TYPE=secret
      - PEERCALLS_ICE_SERVER_USERNAME=peercalls
      - PEERCALLS_ICE_SERVER_SECRET=${COTURN_SECRET}

  pompui-coturn:
    # ports from the main compose file stay published (3478 + relay range);
    # only the network join is overridden away from the external web-network,
    # and coturn advertises the LAN IP so LAN clients can actually reach it
    networks: !override
      - pompui-network
    command: !override
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${COTURN_SECRET}
      - --realm=pompui.de
      - --external-ip=192.168.178.60
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - -p
      - "3478"

