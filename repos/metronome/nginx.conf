server {
    listen 8080;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
    # SPA fallback: dist/404.html is a copy of index.html (gh-pages-404 plugin in
    # vite.config.ts), so client-side routes (/exercises, /polyrhythm) also load
    # on a direct visit.
    error_page 404 /404.html;

    # hashed build assets: short cache so updates land quickly
    location /assets/ {
        root /usr/share/nginx/html;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }
    # HTML, service worker and manifest must always be revalidated
    location ~* ^/(index\.html|404\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
